name: macOS checks
on:
  push:
  pull_request:
jobs:
  test-and-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: ./scripts/test.sh
      - run: ./scripts/test-release.sh
      - run: ./scripts/build-app.sh
      - run: ditto -c -k --sequesterRsrc --keepParent "dist/Sprintwake Projects.app" dist/Sprintwake-Projects-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Sprintwake-macOS
          path: dist/Sprintwake-Projects-macOS.zip
